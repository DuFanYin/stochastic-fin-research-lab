# The quantlab package: `pip install .` (or pip install git+https://github.com/DuFanYin/stochastic-fin-research-lab)
# builds the C++ engine with CMake and installs it with the Python package (server/quantlab) and the built workbench.
# Needs what ./run.sh build needs: CMake, a C++23 compiler with OpenMP, nlohmann/json.

[build-system]
requires = ["scikit-build-core==1.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "quantlab"
dynamic = ["version"]
description = "Option pricing, calibration, risk and a live options screener on a C++23 engine: a library, a CLI, an HTTP API and an MCP server for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Hang Zhengyang" }]
keywords = ["quantitative-finance", "option-pricing", "black-scholes", "monte-carlo", "heston", "deribit", "mcp", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Compatible ranges; server/requirements.txt pins the exact versions the lab runs with.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quantlab = "quantlab.cli:main"
quantlab-mcp = "quantlab.cli:mcp_main"

[project.urls]
Homepage = "https://dufanyin.dev/lab/"
Source = "https://github.com/DuFanYin/stochastic-fin-research-lab"
Documentation = "https://github.com/DuFanYin/stochastic-fin-research-lab/blob/main/DOCUMENTATION.md"

[tool.scikit-build]
cmake.source-dir = "engine"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["server/quantlab"]
wheel.py-api = "py3"   # the engine is a plain shared library, not a Python extension: any Python 3
wheel.exclude = ["**/__pycache__/**"]
sdist.exclude = ["web/node_modules", "engine/build", "build", "server/.venv", "**/__pycache__"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "server/quantlab/version.py"
regex = '__version__ = "(?P<value>[^"]+)"'

[tool.pytest.ini_options]
testpaths = ["tests"]
